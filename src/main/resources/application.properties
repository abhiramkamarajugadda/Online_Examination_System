spring.application.name=OnlineExaminationSystem

# Database: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD win if set (Render + Aiven),
# otherwise DB_URL / DB_USERNAME / DB_PASSWORD, otherwise a local MySQL.
# Aiven example: jdbc:mysql://HOST:PORT/defaultdb?sslMode=REQUIRED
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_exam?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=true

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Render sets PORT; local default stays 4545
server.port=${PORT:4545}
server.forward-headers-strategy=framework

# Admin login (set ADMIN_EMAIL / ADMIN_PASSWORD in production; defaults are for local use only)
app.admin.email=${ADMIN_EMAIL:admin@examsphere.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Demo data: a sample exam and a public demo student on an empty database
app.demo.seed=${DEMO_SEED:true}
app.demo.student-email=demo@examsphere.com
app.demo.student-password=demo123
