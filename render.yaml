# Render Blueprint: New > Blueprint > pick this repo. Values marked sync: false are typed
# into the Render dashboard (never committed). The database is a free Aiven MySQL service.
services:
  - type: web
    name: examsphere
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      # jdbc:mysql://<aiven-host>:<port>/defaultdb?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Admin login; the password is generated by Render (read it from the dashboard)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      # Seeds a sample exam and the public demo student on an empty database
      - key: DEMO_SEED
        value: "true"
